name: ClaudeGauge
options:
  bundleIdPrefix: dev.claudegauge
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  usesTabs: false
  indentWidth: 4
  tabWidth: 4

# Project-wide. Swift 6.2+ (Xcode 26) infers main-actor isolation for a lot
# of app code that Swift 6.0 (Xcode 16 — the minimum this project claims to
# support, and what CI builds with) requires you to annotate. Left to the
# toolchain default, a build that's green on a new Xcode can fail on a
# supported one; pinning `nonisolated` makes local builds use the same rules
# as CI, so that drift shows up here instead of in a pull request.
settings:
  base:
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

packages:
  ClaudeGaugeCore:
    path: ClaudeGaugeCore

targets:
  ClaudeGauge:
    type: application
    platform: macOS
    sources:
      - path: ClaudeGauge
      - path: Shared
    dependencies:
      - package: ClaudeGaugeCore
      - target: ClaudeGaugeWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.claudegauge.app
        PRODUCT_NAME: ClaudeGauge
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: ClaudeGauge
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 ClaudeGauge contributors. Not affiliated with or endorsed by Anthropic."
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 48MQ7BVS99
        CODE_SIGN_ENTITLEMENTS: ClaudeGauge/ClaudeGauge.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "14.0"

  ClaudeGaugeWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: ClaudeGaugeWidget
      - path: Shared
    dependencies:
      - package: ClaudeGaugeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.claudegauge.app.widget
        PRODUCT_NAME: ClaudeGaugeWidget
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ClaudeGaugeWidget/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 48MQ7BVS99
        CODE_SIGN_ENTITLEMENTS: ClaudeGaugeWidget/ClaudeGaugeWidget.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"

schemes:
  ClaudeGauge:
    build:
      targets:
        ClaudeGauge: all
        ClaudeGaugeWidget: all
    run:
      config: Debug
    archive:
      config: Release
